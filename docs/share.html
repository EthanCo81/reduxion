<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open in Reduxion</title>
  <meta name="description" content="Open this Reduxion puzzle on your phone, or get the app from the App Store.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top, #1d3a45 0%, #151718 55%);
      color: #ECEDEE;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
    }
    h1 {
      color: #0a7ea4;
      font-size: 2rem;
      margin-bottom: 8px;
    }
    .subtitle {
      opacity: 0.75;
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .puzzle {
      background: rgba(10, 126, 164, 0.12);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 28px;
    }
    .label {
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      opacity: 0.6;
      margin-bottom: 6px;
    }
    .value {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 14px;
    }
    .value:last-child { margin-bottom: 0; }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    a.button {
      display: block;
      text-decoration: none;
      border-radius: 12px;
      padding: 14px 18px;
      font-weight: 600;
      font-size: 1rem;
    }
    .primary {
      background: #0a7ea4;
      color: #fff;
    }
    .secondary {
      background: transparent;
      color: #ECEDEE;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .note {
      margin-top: 20px;
      font-size: 0.85rem;
      opacity: 0.55;
      line-height: 1.4;
    }
    .error {
      color: #ff8a80;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Reduxion</h1>
    <p class="subtitle" id="subtitle">Opening this shared puzzle…</p>
    <div class="puzzle" id="puzzle" hidden>
      <div class="label">Target</div>
      <div class="value" id="targetValue"></div>
      <div class="label">Numbers</div>
      <div class="value" id="numbersValue"></div>
      <div class="label">Difficulty</div>
      <div class="value" id="difficultyValue"></div>
    </div>
    <p class="error" id="error" hidden>This share link is missing puzzle details.</p>
    <div class="actions">
      <a class="button primary" id="openApp" href="#">Open in Reduxion</a>
      <a class="button secondary" id="appStore" href="https://apps.apple.com/app/id6759681524">Get it on the App Store</a>
    </div>
    <p class="note">If Reduxion is installed, it should open this exact puzzle. Otherwise, grab it from the App Store and try the link again.</p>
  </div>
  <script>
    (function () {
      var APP_STORE_URL = 'https://apps.apple.com/app/id6759681524';
      var params = new URLSearchParams(window.location.search);
      var numbers = params.get('numbers');
      var target = params.get('target');
      var difficulty = params.get('difficulty');
      var valid = Boolean(numbers && target && difficulty);

      var openApp = document.getElementById('openApp');
      var appStore = document.getElementById('appStore');
      var subtitle = document.getElementById('subtitle');
      var puzzle = document.getElementById('puzzle');
      var error = document.getElementById('error');

      appStore.href = APP_STORE_URL;

      if (!valid) {
        subtitle.textContent = 'Unable to open puzzle';
        error.hidden = false;
        openApp.style.display = 'none';
        return;
      }

      var deepLink =
        'reduxion://puzzle?numbers=' + encodeURIComponent(numbers) +
        '&target=' + encodeURIComponent(target) +
        '&difficulty=' + encodeURIComponent(difficulty);

      document.getElementById('targetValue').textContent = target;
      document.getElementById('numbersValue').textContent = numbers.split(',').join(' · ');
      document.getElementById('difficultyValue').textContent =
        difficulty.charAt(0).toUpperCase() + difficulty.slice(1);
      puzzle.hidden = false;
      subtitle.textContent = 'Can you beat this score?';
      openApp.href = deepLink;

      // Attempt to open the app immediately; fall back to the App Store shortly after.
      var fallbackTimer = setTimeout(function () {
        window.location.href = APP_STORE_URL;
      }, 1600);

      window.location.href = deepLink;

      document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
          clearTimeout(fallbackTimer);
        }
      });

      openApp.addEventListener('click', function () {
        clearTimeout(fallbackTimer);
      });
      appStore.addEventListener('click', function () {
        clearTimeout(fallbackTimer);
      });
    })();
  </script>
</body>
</html>
